
name: Update Concerts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download concert data
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwn4udz90VuI9p3UzRs4nrZNoPbVLVyszvNddDEuX0TGkcTxHFNkxoBCHBZ1zd4LjNA/exec
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          url = os.environ["API_URL"] + "?callback=concertSync"
          request = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              text = response.read().decode("utf-8")

          match = re.fullmatch(
              r"\s*concertSync\((.*)\)\s*;?\s*", text, re.S
          )
          if not match:
              raise ValueError("Unexpected API response")

          events = json.loads(match.group(1))
          if not isinstance(events, list):
              raise ValueError("Concert data must be a list")

          with open("concerts-cache.json", "w", encoding="utf-8") as f:
              json.dump(events, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Update concert data cache"
            git push
          fi
